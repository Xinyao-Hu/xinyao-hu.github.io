
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xinyao Hu | Portfolio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f5f5f3;
    color: #222;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    padding: 65px 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    font-size: 42px;
    font-weight: 650;
    letter-spacing: -1px;
    margin-bottom: 12px;
}

.subtitle {
    color: #777;
    font-size: 19px;
    margin-bottom: 50px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px;
}

.card {
    display: block;
    background: white;
    border-radius: 13px;
    overflow: hidden;
    text-decoration: none;
    color: #222;
    box-shadow: 0 3px 15px rgba(0,0,0,.07);
    transition: transform .25s, box-shadow .25s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
}

.card-img {
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #e9e9e9;
}

.card-img img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .4s;
}

.card:hover .card-img img {
    transform: scale(1.035);
}

.info {
    padding: 22px 24px 25px;
}

.info h2 {
    font-size: 25px;
    margin-bottom: 9px;
    font-weight: 650;
}

.info p {
    color: #888;
    font-size: 16px;
    line-height: 1.6;
}

.arrow {
    display: inline-block;
    margin-top: 13px;
    font-size: 13px;
    color: #444;
}

@media(max-width: 750px) {
    body {
        padding: 35px 18px;
    }

    h1 {
        font-size: 32px;
    }

    .subtitle {
        margin-bottom: 30px;
    }

    .grid {
        grid-template-columns: 1fr;
        gap: 22px;
    }

    .info h2 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Xinyao Hu | Portfolio</h1>
    <p class="subtitle">Design Works & Immersive Experiences</p>

    <div class="grid">

        <!-- Design Portfolio -->
        <a class="card" href="works/Design-Portfolio/index.html">

            <div class="card-img">
                <img src="covers/design-cover.jpg"
                     alt="设计作品集封面">
            </div>

            <div class="info">
                <h2>设计作品集</h2>
                <p>创意设计 · 视觉叙事 · 三维艺术</p>
                <span class="arrow">查看作品集 ↗</span>
            </div>

        </a>

        <!-- VR Portfolio -->
        <a class="card" href="works/VR-Portfolio/index.html">

            <div class="card-img">
                <img src="covers/vr-cover.jpg"
                     alt="VR沉浸式作品集封面">
            </div>

            <div class="info">
                <h2>VR 沉浸式作品集</h2>
                <p>虚拟现实 · 沉浸式交互 · 互动叙事</p>
                <span class="arrow">查看作品集 ↗</span>
            </div>

        </a>

    </div>

</div>

</body>
</html>
