<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xinyao Hu - Portfolio</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
        body{background:#f4f4f4;max-width:1200px;margin:0 auto;padding:40px 20px;}
        h1{font-size:36px;margin-bottom:10px;color:#222;}
        .desc{color:#666;margin-bottom:40px;font-size:18px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px,1fr));gap:24px;}
        .card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #00000015;}
        .card img{width:100%;height:200px;object-fit:cover;}
        .card .info{padding:16px;}
        .card h3{margin-bottom:8px;}
        .card a{text-decoration:none;color:#222;}
    </style>
</head>
<body>
    <h1>Xinyao Hu | Portfolio</h1>
    <p class="desc">Design Works</p>
    <div class="grid">
        <div class="card">
            <a href="works/work-01/">
                <img src="works/work-01/cover.jpg" alt="work1">
                <div class="info">
                    <h3>Work 01</h3>
                </div>
            </a>
        </div>
        <div class="card">
            <a href="works/work-02/">
                <img src="works/work-02/cover.jpg" alt="work2">
                <div class="info">
                    <h3>Work 02</h3>
                </div>
            </a>
        </div>
        <div class="card">
            <a href="works/work-03/">
                <img src="works/work-03/cover.jpg" alt="work3">
                <div class="info">
                    <h3>Work 03</h3>
                </div>
            </a>
        </div>
        <div class="card">
            <a href="works/work-04/">
                <img src="works/work-04/cover.jpg" alt="work4">
                <div class="info">
                    <h3>Work 04</h3>
                </div>
            </a>
        </div>
        <div class="card">
            <a href="works/work-05/">
                <img src="works/work-05/cover.jpg" alt="work5">
                <div class="info">
                    <h3>Work 05</h3>
                </div>
            </a>
        </div>
        <div class="card">
            <a href="works/work-06/">
                <img src="works/work-06/cover.jpg" alt="work6">
                <div class="info">
                    <h3>Work 06</h3>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
